name: Binlayout audit checks

on:
  pull_request:
    paths:
      - ".github/workflows/binlayout-audit.yml"
      - "proof/*verify_binlayout_release.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/binlayout-audit.yml"
      - "proof/*verify_binlayout_release.py"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s proof -p test_verify_binlayout_release.py -v
